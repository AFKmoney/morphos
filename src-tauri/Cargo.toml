[package]
name = "morphos"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = ["config-toml"] }

[dependencies]
tauri = { version = "2.0", features = ["shell-open", "http-all", "os-all", "path-all", "fs-all", "dialog-all", "notification-all", "window-all", "process-all", "global-shortcut-all"] }
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-websocket = "2.0"
tauri-plugin-positioner = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
